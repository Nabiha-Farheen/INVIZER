<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tax Invoice</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .bill { max-width: 800px; margin: 16px auto; background: #fff; padding: 12px; font-size: 13px; }
    .bill table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
    .bill th, .bill td { border: 1px solid #000; padding: 4px 6px; vertical-align: top; }
    .bill .r { text-align: right; }
    .bill .c { text-align: center; }
    .bill .noborder td { border: 0; }
    .bill small { color: #444; }
    .toolbar { max-width: 800px; margin: 12px auto; display: flex; gap: 10px; }
    .toolbar button, .toolbar a { width: auto; padding: 8px 14px; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .bill { margin: 0; max-width: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <a href="invoices.html">&larr; Back to invoices</a>
    <button onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="bill" class="bill">Loading...</div>
  <script src="common.js"></script>
  <script src="invoice-view.js"></script>
</body>
</html>
