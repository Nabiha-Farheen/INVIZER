<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Invoice Manager</h1>

    <form id="loginForm">
      <h2>Login</h2>
      <input id="loginId" placeholder="Login ID" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p class="link" id="showSignup">New business? Sign up</p>
    </form>

    <form id="signupForm" hidden>
      <h2>Register your business</h2>
      <input id="bName" placeholder="Business name" required>
      <input id="bLoginId" placeholder="Choose a login ID" required>
      <input id="bPassword" type="password" placeholder="Choose a password" required>
      <input id="bPrefix" placeholder="Invoice prefix (e.g. SPI)" maxlength="10">
      <button type="submit">Sign up</button>
      <p class="link" id="showLogin">Already registered? Login</p>
    </form>

    <p id="message"></p>
  </div>
  <script src="auth.js"></script>
</body>
</html>
