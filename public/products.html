<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="products.html">Products</a>
      <a href="invoices.html">Invoices</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>

    <h1>Products</h1>

    <form id="productForm" class="panel">
      <h2 id="formTitle">Add product</h2>
      <input id="name" placeholder="Product name" required>
      <input id="hsn_code" placeholder="HSN code" maxlength="10">
      <input id="unit" placeholder="Unit (e.g. Pac, Nos)" maxlength="10">
      <input id="mrp" type="number" step="0.01" min="0" placeholder="MRP" required>
      <input id="rate" type="number" step="0.01" min="0" placeholder="Your selling rate" required>
      <input id="gst_rate" type="number" step="0.01" min="0" placeholder="GST % (e.g. 5)" required>
      <button type="submit">Save product</button>
      <button type="button" id="cancelBtn" hidden>Cancel edit</button>
      <p id="message"></p>
    </form>

    <table>
      <thead>
        <tr><th>Name</th><th>HSN</th><th>Unit</th><th>MRP</th><th>Rate</th><th>GST %</th><th></th></tr>
      </thead>
      <tbody id="productRows"></tbody>
    </table>
  </div>
  <script src="common.js"></script>
  <script src="products.js"></script>
</body>
</html>
